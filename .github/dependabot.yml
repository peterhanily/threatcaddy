version: 2
updates:
  # Each package keeps its own package manager and lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # Keep Node API declarations on the supported Node 24 runtime line.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      vitest:
        patterns: [vitest, '@vitest/*']
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # A newer runtime major needs a coordinated image/engine/toolchain upgrade.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  # Lockfile audits and the image scan do not inventory the Node binary, so this
  # reports new node:<version>-alpine releases and digests for server/Dockerfile.
  # Docker gets no Dependabot security updates, so a daily check and a short
  # cooldown keep a Node security release within days of review.
  # A version proposal fails the CI contract tests until .node-version, .nvmrc
  # and README.md are updated with it.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    cooldown:
      default-days: 2
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
  # Preserve full commit-SHA action pins and their readable version comments.
  # Updates still require the normal verification and review gates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
