name: Deploy Server Docker Image

# Explicit manual publication always verifies the selected main revision.
# This publishes an image to GHCR; it does not roll out a running team server.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-server.yml
    with:
      source-sha: ${{ needs.verify.outputs.source-sha }}
      server-artifact-id: ${{ needs.verify.outputs.server-artifact-id }}
