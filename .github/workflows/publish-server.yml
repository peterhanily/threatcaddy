name: Publish verified server image

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source revision approved by the verification gate
        required: true
        type: string
      server-artifact-id:
        description: Immutable tested server image artifact ID from this same run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  publish:
    name: Promote verified server image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require exact source and immutable artifact inputs
        env:
          VERIFIED_SHA: ${{ inputs.source-sha }}
          ARTIFACT_ID: ${{ inputs.server-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.server-artifact-id }}
          path: verified-server
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and push the already tested image
        env:
          VERIFIED_SHA: ${{ inputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          cd verified-server
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check server-image.tar.sha256
          docker load --input server-image.tar
          image_id=$(cat server-image.id)
          test "$(docker image inspect threatcaddy-server:verify --format '{{.Id}}')" = "$image_id"
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA" || { echo 'Refusing to publish a superseded main commit'; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}/server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$image_id" "$image:sha-$GITHUB_SHA"
          docker tag "$image_id" "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
