name: Publish verified server image

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source revision approved by the verification gate
        required: true
        type: string
      server-artifact-id:
        description: Immutable tested server image artifact ID from this same run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  publish:
    name: Promote verified server image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require exact source and immutable artifact inputs
        env:
          VERIFIED_SHA: ${{ inputs.source-sha }}
          ARTIFACT_ID: ${{ inputs.server-artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.server-artifact-id }}
          path: verified-server
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and push the already tested image
        env:
          VERIFIED_SHA: ${{ inputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          cd verified-server
          test "$(cat source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check server-image.tar.sha256
          docker load --input server-image.tar
          image_id=$(cat server-image.id)
          test "$(docker image inspect threatcaddy-server:verify --format '{{.Id}}')" = "$image_id"
          test "$(docker image inspect "$image_id" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          # The release version is server/package.json as packaged in the verified
          # image, copied out of a created container that never starts.
          container=$(docker create "$image_id")
          docker cp "$container:/app/package.json" - | tar -xOf - package.json > image-package.json
          docker rm "$container" > /dev/null
          version=$(jq -er '.version' image-package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Refusing to publish an image without a stable release version'; exit 1; }
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA" || { echo 'Refusing to publish a superseded main commit'; exit 1; }
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          # A version tag names the first verified build of that version, the
          # release commit; later builds of the same version never move it.
          if docker manifest inspect "$image:$version" > /dev/null 2> version-tag.log; then
            push_version=false
            echo "::notice::$image:$version already exists and stays on its first build"
          # Docker Hub says "no such manifest"; GHCR says "manifest unknown".
          elif grep -q -E 'no such manifest|manifest unknown' version-tag.log; then
            push_version=true
          else
            cat version-tag.log >&2
            echo "Could not check whether $image:$version exists; nothing was pushed"
            exit 1
          fi
          docker tag "$image_id" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          if [ "$push_version" = true ]; then
            docker tag "$image_id" "$image:$version"
            docker push "$image:$version"
          fi
          # latest moves last: ci-release-scope.mjs treats latest at this commit
          # as a complete publication, so every other tag must already exist.
          docker tag "$image_id" "$image:latest"
          docker push "$image:latest"
