name: Deploy to GitHub Pages

# Explicit manual release entry point, including `pnpm deploy`.
# Automatic main publication is orchestrated by CI so verification runs once.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    with:
      source-sha: ${{ needs.verify.outputs.source-sha }}
      client-artifact-id: ${{ needs.verify.outputs.client-artifact-id }}
